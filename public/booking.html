<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noclegi - Rezerwacja</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Rezerwacja Noclegów</h1>
        <nav>
            <a href="index.html">Wyszukiwarka</a>
            <a href="booking.html">Rezerwacja</a>
        </nav>
    </header>

    <main>
        <section class="booking-section">
            <h2>Formularz rezerwacji</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label for="offer-id">ID Oferty:</label>
                    <input type="number" id="offer-id" name="offerId" required>
                </div>
                
                <div class="form-group">
                    <label for="name">Imię i nazwisko:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Telefon:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="checkin-date">Data przyjazdu:</label>
                    <input type="date" id="checkin-date" name="checkinDate" required>
                </div>
                
                <div class="form-group">
                    <label for="checkout-date">Data wyjazdu:</label>
                    <input type="date" id="checkout-date" name="checkoutDate" required>
                </div>
                
                <div class="form-group">
                    <label for="guests-count">Liczba gości:</label>
                    <input type="number" id="guests-count" name="guestsCount" min="1" value="1" required>
                </div>
                
                <div class="form-group">
                    <label for="notes">Dodatkowe uwagi:</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>
                
                <button type="submit" class="btn-primary">Zarezerwuj</button>
            </form>
            
            <div id="booking-result" class="result-message"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projekt Noclegi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
